# Despliega el frontend (React + Vite, PWA) en Azure App Service (Linux, Node).
# Docs: https://github.com/Azure/webapps-deploy

name: Deploy frontend a Azure - GestionFitness-WebApp-Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: GestionFitness-WebApp-Dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # Solo se publica la carpeta dist (archivos estáticos), no el repo ni node_modules
      - name: Subir el build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # Necesario para el login con OIDC
      contents: read

    steps:
      - name: Descargar el build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BB7EA2FE352249A3A3487BD40286B8EF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0BF07C60ECAC417090162615346ACBB0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3616114ED7554BA9BE0133A66B328454 }}

      # Requisito (configurado una sola vez en el portal de Azure):
      # App Service → Configuración → Configuración de la pila → Comando de inicio:
      #   pm2 serve /home/site/wwwroot --no-daemon --spa
      - name: Desplegar en Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: dist
